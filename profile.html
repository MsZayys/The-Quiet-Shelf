<!-- ================= PROFILE ================= -->

<section class="profile-container">

<div class="left-side">

<!-- PROFILE CARD -->

<div class="profile-card">

<img
id="selectedAvatar"
src="images/avatars/avatar1.png"
class="selected-avatar"
>

<h2 id="profileName">

Reader

</h2>

<p id="profileEmail">

Loading...

</p>

</div>

<!-- AVATAR CARD -->

<div class="profile-card">

<h3>

Choose Your Avatar

</h3>

<div class="avatar-grid">

<img src="images/avatars/avatar1.png" class="avatar">
<img src="images/avatars/avatar2.png" class="avatar">
<img src="images/avatars/avatar3.png" class="avatar">
<img src="images/avatars/avatar4.png" class="avatar">

<img src="images/avatars/avatar10.png" class="avatar">
<img src="images/avatars/avatar11.png" class="avatar">
<img src="images/avatars/avatar12.png" class="avatar">

</div>

</div>

</div>

<!-- RIGHT SIDE -->

<div class="profile-form">

<h2>

Edit Profile

</h2>

<input
type="text"
id="nameInput"
placeholder="Enter Your Name"
>

<button id="saveProfile">

Save Changes

</button>

</div>
